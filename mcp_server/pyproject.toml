[project]
name = "fusion360-mcp"
version = "1.13.0"
description = "Model Context Protocol server for Autodesk Fusion 360"
requires-python = ">=3.10"
dependencies = [
    # >=1.29: the FINAL 1.x line (2026-07-28) — 1.x is maintenance-only now, so
    # take its last fixes deliberately. The server degrades gracefully to plain
    # tools on older SDKs (see _annot in server.py).
    # <2: mcp 2.0 (spec 2026-07-28) renames FastMCP to MCPServer with NO alias
    # (mcp.server.fastmcp imports die), moves sync tools onto anyio worker
    # threads, and replaces ctx.elicit on new-spec connections with the
    # Resolve() pattern — migrate deliberately, not via a silent pip upgrade.
    "mcp>=1.29,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Scan analysis for reverse engineering (scan_analyze/scan_sections/
# scan_deviation/scan_align/scan_fit_check/scan_cavity_sections) — heavy,
# so opt-in. The server runs fine without them.
re = [
    "numpy>=1.26",
    "trimesh>=4.0",
    "pyransac3d>=0.6",
    # trimesh's ray backend (wall thickness, dfm occlusion) needs rtree.
    "rtree>=1.0",
]
# Photo -> CAD (photo_rectify/photo_to_sketch). The -contrib- headless OpenCV
# wheel carries the ArUco marker detector; plain opencv-python would clash.
photo = [
    "opencv-contrib-python-headless>=4.10",
    "ezdxf>=1.3",
]
# Code-CAD (codecad_run): build123d pulls the VTK-free OCP wheel (~50 MB).
codecad = [
    "build123d>=0.11",
]

[tool.uv]
package = false
