[project]
name = "fusion360-mcp"
version = "1.16.0"
description = "Model Context Protocol server for Autodesk Fusion 360"
requires-python = ">=3.10"
dependencies = [
    # >=1.29.1: final 1.x maintenance release (2026-08-24). The server degrades
    # gracefully to plain tools on older SDKs (see _annot in server.py).
    # <3: v1.16 runs on BOTH 1.x and 2.x — server.py shims the FastMCP ->
    # MCPServer rename (2.x has no alias) and the Context import path; 2.x
    # runs sync tools on anyio worker threads, which is safe because
    # FusionClient.call holds a lock for the whole request/response. Verified
    # by importing server.py under mcp 2.x (198 tools registered).
    "mcp>=1.29.1,<3",
    # ISO 286 fit/tolerance data for fit_suggest (MIT, pure Python, tiny).
    "isofits>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Scan analysis for reverse engineering (scan_analyze/scan_sections/
# scan_deviation/scan_align/scan_fit_check/scan_cavity_sections) — heavy,
# so opt-in. The server runs fine without them.
re = [
    "numpy>=1.26",
    "trimesh>=4.0",
    "pyransac3d>=0.6",
    # trimesh's ray backend (wall thickness, dfm occlusion) needs rtree.
    "rtree>=1.0",
    # marching cubes for scan_mesh_offset (voxel offset / drop-on cavity).
    "scikit-image>=0.22",
]
# Photo -> CAD (photo_rectify/photo_to_sketch). The -contrib- headless OpenCV
# wheel carries the ArUco marker detector; plain opencv-python would clash.
photo = [
    "opencv-contrib-python-headless>=4.10",
    "ezdxf>=1.3",
]
# Code-CAD (codecad_run): build123d pulls the VTK-free OCP wheel (~50 MB).
codecad = [
    "build123d>=0.11",
]

[tool.uv]
package = false
