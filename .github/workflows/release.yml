# Pushnięcie tagu `vX.Y.Z` publikuje release z auto-generowanymi release notes;
# updater FusionMCP czyta z niego tag_name (wersję) i body (notes).
# Release jest BRAMKOWANY testami (needs: test): auto-updater roznosi „latest"
# na maszyny użytkowników, więc zielony pytest+ruff+import serwera jest warunkiem.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dev tooling + runtime deps
        run: >-
          python -m pip install --upgrade pip pytest ruff
          "mcp>=1.9,<2" numpy trimesh pyransac3d rtree
          opencv-contrib-python-headless ezdxf
      - name: Ruff lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -rs

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Release body = the CHANGELOG.md section for this tag (user-facing
      # Added/Fixed lists — shown by the in-Fusion update popup), plus the
      # auto-generated compare link appended by generate_release_notes.
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! [ -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section for $GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
